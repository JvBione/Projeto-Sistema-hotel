<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acesso à Administração • Hotel das Oliveiras</title>
    <link rel="icon" type="image/x-icon" href="app.ico" />
    <link rel="stylesheet" href="css/main.css" />
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: min(100%, 440px);
            background: var(--bg-surface);
            border: 1px solid var(--border-highlight);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow-lg);
        }

        .login-card h1 {
            margin: 0 0 8px;
            color: var(--text-primary);
            font-size: 1.4rem;
        }

        .login-card p {
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .login-error {
            min-height: 1.25rem;
            color: #fca5a5 !important;
            font-size: 0.85rem;
        }

        .login-card .btn {
            width: 100%;
            justify-content: center;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="brand-icon" aria-hidden="true">🌿</div>
        <h1 id="loginTitle">Administração</h1>
        <p id="loginDescription">Verificando o acesso...</p>

        <form id="loginForm" hidden>
            <div class="form-group">
                <label for="username">Usuário</label>
                <input id="username" name="username" class="form-input" type="text"
                    autocomplete="username" minlength="3" maxlength="32" required />
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input id="password" name="password" class="form-input" type="password"
                    autocomplete="current-password" minlength="10" maxlength="128" required />
            </div>
            <div class="form-group" id="confirmPasswordGroup" hidden>
                <label for="confirmPassword">Confirme a senha</label>
                <input id="confirmPassword" name="confirmPassword" class="form-input" type="password"
                    autocomplete="new-password" minlength="10" maxlength="128" />
            </div>
            <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
            <button id="loginSubmit" class="btn btn-primary" type="submit">Entrar</button>
        </form>

        <p id="launcherMessage" class="login-error" hidden>
            Não foi possível conectar ao servidor local. Inicie o sistema pelo arquivo
            <strong>Hotel das Oliveiras.exe</strong>.
        </p>
        <p style="margin-top: 20px;">
            <a href="index.html" style="color: var(--text-gold);">Voltar à recepção</a>
        </p>
    </main>
    <script src="js/login.js"></script>
</body>

</html>
